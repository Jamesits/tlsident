name: Build

on:
  pull_request:
    paths-ignore:
      - 'README.md'
  push:
    paths-ignore:
      - 'README.md'

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            goreleaser.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - run: go mod download

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          args: build --clean --snapshot

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  validate:
    name: Validate
    needs: build
    if: ${{ needs.build.result == 'success' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run local capture
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://localhost:8443
          ANTHROPIC_AUTH_TOKEN: 'dummy'
          DISABLE_AUTOUPDATER: '1'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -Eeuo pipefail

          TLSIDENT_BIN="$(find dist -type f -path '*linux_amd64*' -name tlsident | head -n 1)"
          chmod +x "$TLSIDENT_BIN"

          "$TLSIDENT_BIN" -outdir "./results" &
          tlsident_pid=$!
          cleanup() {
            kill "$tlsident_pid" 2>/dev/null || true
            wait "$tlsident_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3

          http_proxy='' https_proxy='' all_proxy='' claude --bare -p "test" --no-session-persistence || true

      - name: Run upstream capture
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://tls.sub2api.org:8090
          DISABLE_AUTOUPDATER: '1'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -Eeuo pipefail

          export ANTHROPIC_AUTH_TOKEN="$(openssl rand -hex 16)"

          # validate we don't have any existing fingerprints before starting the test
          before_count="$(curl -fsSL "https://tls.sub2api.org/api/latest?token=${ANTHROPIC_AUTH_TOKEN}" | jq -r '.count // 0')"
          if [ "$before_count" -gt 0 ]; then
            echo "sub2api already had $before_count fingerprints before the test started" >&2
            exit 1
          fi

          http_proxy='' https_proxy='' all_proxy='' claude --bare -p "test" --no-session-persistence || true
          sleep 3

          curl -fsSL "https://tls.sub2api.org/api/latest?token=${ANTHROPIC_AUTH_TOKEN}" -o "./upstream.json"

      - name: Compare normalized fingerprints
        # FIXME: upstream currently ignores TLS extension 21 (Padding), so this job will always fail. Re-enable the failure condition once the issue is resolved.
        continue-on-error: true
        shell: bash
        run: bash ./.github/scripts/compare-sub2api.sh "./results" "./upstream.json"

      - name: Upload online test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: online-test-artifacts
          path: |
            ./results
            ./upstream.json
