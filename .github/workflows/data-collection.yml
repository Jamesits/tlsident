name: Data Collection

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  hosted:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs_on }}
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: 'dummy'
      ANTHROPIC_AUTH_TOKEN: 'dummy'
      ANTHROPIC_BASE_URL: https://localhost:8443
      DISABLE_AUTOUPDATER: '1'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-native
            runs_on: windows-latest
            binary: tlsident_windows_amd64_v1/tlsident.exe
          - name: macos-native
            runs_on: macos-latest
            binary: tlsident_darwin_arm64_v8.0/tlsident
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage tlsident binary
        if: runner.os != 'Windows'
        run: |
          cp "dist/${{ matrix.binary }}" "$RUNNER_TEMP/tlsident"
          chmod +x "$RUNNER_TEMP/tlsident"

      - name: Stage tlsident binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "dist/${{ matrix.binary }}" (Join-Path $env:RUNNER_TEMP 'tlsident.exe')

      - name: Install Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

      - name: Install Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://claude.ai/install.ps1 | iex
          "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"
          claude --version

      - name: Run tlsident flow
        if: runner.os != 'Windows'
        run: |
          mkdir -p results
          "$RUNNER_TEMP/tlsident" -outdir results >"$RUNNER_TEMP/tlsident.log" 2>&1 &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3

          claude --bare -p "test" --no-session-persistence

          find results -maxdepth 1 -type f | grep -q .

      - name: Run tlsident flow
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path results | Out-Null
          $stdoutLog = Join-Path $env:RUNNER_TEMP 'tlsident.stdout.log'
          $stderrLog = Join-Path $env:RUNNER_TEMP 'tlsident.stderr.log'
          $proc = Start-Process -FilePath (Join-Path $env:RUNNER_TEMP 'tlsident.exe') -ArgumentList '-outdir', 'results' -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
          try {
            Start-Sleep -Seconds 3

            claude --bare -p 'test' --no-session-persistence
          } finally {
            if ($proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force
            }
          }

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-results
          path: |
            results
          if-no-files-found: error

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.container }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      ANTHROPIC_API_KEY: dummy-key
      ANTHROPIC_AUTH_TOKEN: anything
      ANTHROPIC_BASE_URL: https://localhost:8443
      DISABLE_AUTOUPDATER: '1'
      NODE_TLS_REJECT_UNAUTHORIZED: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-24.04-native
            container: ubuntu:24.04
            distro: ubuntu
            install_method: native
          - name: archlinux-native
            container: archlinux:latest
            distro: arch
            install_method: native
          - name: archlinux-aur
            container: archlinux:latest
            distro: arch
            install_method: aur
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@6c3c2f2c1c457b00c10c4848d6f5491db3b629df # v2.18.0
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - name: Install container dependencies
        run: |
          if [ "${{ matrix.distro }}" = "ubuntu" ]; then
            apt-get update
            apt-get install -y ca-certificates curl git jq
          else
            pacman -Syu --noconfirm --needed ca-certificates curl git jq base-devel sudo
          fi

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage tlsident binary
        run: |
          cp dist/tlsident_linux_amd64_v1/tlsident "$RUNNER_TEMP/tlsident"
          chmod +x "$RUNNER_TEMP/tlsident"

      - name: Install Claude Code
        if: matrix.install_method == 'native'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          claude --version

      - name: Install Claude Code from the AUR
        if: matrix.install_method == 'aur'
        run: |
          useradd -m builder
          install -d /etc/sudoers.d
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          chmod 440 /etc/sudoers.d/builder

          su builder -c 'git clone https://aur.archlinux.org/claude-code.git /tmp/claude-code'
          su builder -c 'cd /tmp/claude-code && makepkg -si --noconfirm --needed'

          claude --version

      - name: Run tlsident flow
        run: |
          mkdir -p results
          "$RUNNER_TEMP/tlsident" -outdir results >"$RUNNER_TEMP/tlsident.log" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3

          claude --bare -p "test" --no-session-persistence

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}-results
          path: |
            results
          if-no-files-found: error

  merge-sub2api-yaml:
    name: Merge Sub2API YAML results
    if: always()
    needs:
      - hosted
      - linux
    runs-on: ubuntu-latest
    steps:
      - name: Download matrix result artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: '*-results'
          path: collected-results

      - name: Merge Sub2API YAML files
        run: |
          mkdir -p merged-results
          mapfile -t yaml_files < <(find collected-results -type f -name '*.sub2api.yml' | sort)
          if [ "${#yaml_files[@]}" -eq 0 ]; then
            echo "No .sub2api.yml files found in matrix artifacts" >&2
            exit 1
          fi

          output_file="merged-results/all.sub2api.yml"
          : > "$output_file"
          for yaml_file in "${yaml_files[@]}"; do
            cat "$yaml_file" >> "$output_file"
            printf '\n' >> "$output_file"
          done

      - name: Upload merged Sub2API YAML
        uses: actions/upload-artifact@v7
        with:
          name: sub2api-yaml
          path: merged-results/all.sub2api.yml
          if-no-files-found: error
