name: Online Test

on:
  workflow_run:
    workflows:
      - Build
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  compare-with-sub2api:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@fe104658747b27e96e4f7e80cd0a94068e53901d # v2.16.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          path: dist

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install --yes jq

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run local capture
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://localhost:8443
          ANTHROPIC_AUTH_TOKEN: 'dummy'
          DISABLE_AUTOUPDATER: '1'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -euo pipefail

          TLSIDENT_BIN="$(find dist -type f -path '*linux_amd64*' -name tlsident | head -n 1)"
          chmod +x "$TLSIDENT_BIN"

          "$TLSIDENT_BIN" -outdir "./results" &
          tlsident_pid=$!
          cleanup() {
            kill "$tlsident_pid" 2>/dev/null || true
            wait "$tlsident_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          sleep 3

          claude --bare -p "test" --no-session-persistence || true

      - name: Run upstream capture
        shell: bash
        env:
          ANTHROPIC_BASE_URL: https://tls.sub2api.org:8090
          DISABLE_AUTOUPDATER: '1'
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: |
          set -Eeuo pipefail

          mkdir -p "$ONLINE_TEST_DIR"
          export ANTHROPIC_AUTH_TOKEN="$(openssl rand -hex 16)"

          # validate we don't have any existing fingerprints before starting the test
          before_count="$(curl -fsSL "https://tls.sub2api.org/api/latest?token=${ANTHROPIC_AUTH_TOKEN}" | jq -r '.count // 0')"
          if [ "$before_count" -gt 0 ]; then
            echo "sub2api already had $before_count fingerprints before the test started" >&2
            exit 1
          fi

          claude --bare -p "test" --no-session-persistence || true
          sleep 3

          curl -fsSL "https://tls.sub2api.org/api/latest?token=${ANTHROPIC_AUTH_TOKEN}" -o "./upstream.json"

      - name: Compare normalized fingerprints
        shell: bash
        run: bash ./.github/scripts/compare-sub2api.sh "./results" "./upstream.json"

      - name: Upload online test artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: online-test-artifacts
          path: |
            ./results
            ./upstream.json
